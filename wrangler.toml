name = "worker-tcpproxy-pluggable-v1"
main = "src/index.ts"
compatibility_date = "2026-11-23"

[placement]
region = "gcp:us-central1"

[observability]
enabled = true

[vars]
PROXY_ENABLED = "false"
DOMAIN_FILTER_ENABLED = "false"
OUTBOUND_MODE = "direct"
ALLOWED_PORTS = "80,443,8080,8443,2053,2083,2087,2096"
# Set ALLOWED_HOSTS in the Cloudflare dashboard or wrangler vars after reviewing the exact domains.
SOCKS5_PORT = "1080"
